version: 2
project_name: openrun

# This one config builds both release channels. The channel comes from
# internal/types/CHANNEL, which is tip on main and pro on a pro-X.Y branch,
# so main and the Pro branches share this file unchanged. The binary embeds
# the same file and reports the channel and license itself.
#   tip: openrun packages and image, Apache-2.0, GitHub latest release
#   pro: openrun-pro packages and image, PolyForm Free Trial
env:
  - CHANNEL={{ trim (readFile "internal/types/CHANNEL") }}
  # false for a patch release of an older line, see the brews section
  - LATEST={{ envOrDefault "OPENRUN_LATEST" "true" }}
  - PKG={{ if eq (trim (readFile "internal/types/CHANNEL")) "pro" }}openrun-pro{{ else }}openrun{{ end }}
  - LICENSE_ID={{ if eq (trim (readFile "internal/types/CHANNEL")) "pro" }}LicenseRef-PolyForm-Free-Trial-1.0.0{{ else }}Apache-2.0{{ end }}

release:
  github:
    owner: openrundev
    name: openrun
  name_template: '{{ if eq .Env.CHANNEL "pro" }}OpenRun Pro {{ .Version }}{{ else }}Release {{ .Tag }}{{ end }}'
  # A Pro release never becomes the GitHub latest release, the installers
  # resolve the latest Tip release through it
  make_latest: '{{ eq .Env.CHANNEL "tip" }}'
  draft: false
  prerelease: "auto"

before:
  hooks:
    - go mod download
    - go mod tidy
    - git clone --single-branch --depth 1 https://github.com/openrundev/appspecs.git
    - rm -rf appspecs/.git
    - rm -rf internal/server/appspecs
    - mv appspecs internal/server
    - git clone --single-branch --depth 1 https://github.com/openrundev/apps.git
    - cp internal/server/list_apps/embed.go .
    - rm -rf internal/server/list_apps
    - mv apps/openrun/list_apps internal/server
    - mv embed.go internal/server/list_apps/
    - rm -rf apps
    # skipped when GOOS is set (the sign-windows job cross-builds the Windows
    # exe, and -race needs cgo which is off for cross builds); the release run
    # has no GOOS set and gates publishing on the full test suite
    - sh -c 'if [ -z "$GOOS" ]; then go test -race ./...; fi'

builds:
  - id: openrun
    main: ./cmd/openrun
    binary: openrun
    flags:
      - -trimpath
    ldflags:
      - -w
      - -X github.com/openrundev/openrun/internal/types.gitCommit={{.ShortCommit}}
      - -X github.com/openrundev/openrun/internal/types.gitVersion={{.Version}}
    env:
      - GO111MODULE=on
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
      - goos: windows
        goarch: arm64
    hooks:
      # Swap in the SignPath Authenticode-signed windows binary before it is
      # archived, so the exe inside the winget zip is signed. No-op for other
      # platforms and when SIGNED_WINDOWS_BINARY is not set (local/snapshot
      # builds).
      post:
        - cmd: ./deploy/sign-windows.sh "{{ .Path }}"
          output: true

nfpms:
  - package_name: "{{ .Env.PKG }}"
    # openrun and openrun-pro install the same binary, so only one can be
    # installed. conflicts and license are not templated by goreleaser. The
    # two lines marked channel-conflicts and channel-license hold the Tip
    # values, deploy/release_channel.sh goreleaser-config rewrites them for
    # a Pro release and the release workflow runs goreleaser with the config
    # it writes. A package must not list itself here, older rpm versions
    # then refuse to reinstall it
    conflicts:
      - openrun-pro # channel-conflicts
    file_name_template: "{{ .Env.PKG }}-{{.Tag}}-{{.Arch}}{{if .Arm}}{{.Arm}}{{end}}"
    homepage: https://openrun.dev/
    description: Open source alternative to Google Cloud Run and AWS App Runner.
    maintainer: Ajay Kidave <contact@openrun.dev>
    license: Apache-2.0 # channel-license
    vendor: ClaceIO LLC.
    formats:
      - deb
      - rpm
    contents:
      - src: /usr/bin/openrun
        dst: /usr/local/bin/openrun
        type: "symlink"

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

archives:
  - name_template: "{{ .Env.PKG }}-{{.Tag}}-{{.Os}}-{{.Arch}}{{if .Arm}}{{.Arm}}{{end}}"
    id: zip-archives
    wrap_in_directory: true
    format: zip
    files:
      - README.md
      - LICENSE
  - name_template: "{{ .Env.PKG }}-{{.Tag}}-{{.Os}}-{{.Arch}}{{if .Arm}}{{.Arm}}{{end}}"
    id: targz-archives
    wrap_in_directory: true
    format: tar.gz
    files:
      - README.md
      - LICENSE

# https://goreleaser.com/customization/changelog/
changelog:
  use: github
  sort: asc
  groups:
    - title: "New Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 10
    - title: "Dependencies"
      regexp: "^.*deps[(\\w)]*:+.*$"
      order: 30
    - title: Other
      order: 999

# Both channels are published, as separate packages that conflict with each
# other: openrun for Tip, openrun-pro for Pro
brews:
  - name: "{{ .Env.PKG }}"
    license: "{{ .Env.LICENSE_ID }}"
    conflicts:
      - '{{ if eq .Env.CHANNEL "pro" }}openrun{{ else }}openrun-pro{{ end }}'
    homepage: https://openrun.dev
    ids: [targz-archives]
    repository:
      owner: openrundev
      name: homebrew-openrun
    dependencies:
      - name: "mkcert"
    service: |
      run [ opt_bin/"openrun", "server", "start" ]
      keep_alive true
      working_dir HOMEBREW_PREFIX
      log_path var/"log/openrun.log"
      error_log_path var/"log/openrun.log"
    # The tap holds one version per formula. A patch release of an older Pro
    # line must not replace the formula of a newer line, OPENRUN_LATEST is set
    # by deploy/release_channel.sh ci-env in the release workflow
    skip_upload: '{{ if eq .Env.LATEST "false" }}true{{ else }}auto{{ end }}'
    install: |-
      bin.install "openrun"
    post_install: |-
      unless File.exist?("#{etc}/openrun.toml")
        pid = spawn("#{opt_bin}/openrun password", out: "#{etc}/openrun.toml")
        puts "********** Initializing \"admin\" user **********"
        Process.wait(pid)
        puts "************* Save this password ****************"

        mkcert_path = `which mkcert`.chomp
        unless mkcert_path.empty?
          system("mkdir -p #{HOMEBREW_PREFIX}/var/openrun/config/certificates")
          system("#{mkcert_path} -install")
          system("#{mkcert_path} -cert-file #{HOMEBREW_PREFIX}/var/openrun/config/certificates/default.crt -key-file #{HOMEBREW_PREFIX}/var/openrun/config/certificates/default.key localhost 127.0.0.1 \"*.localhost\"")
          puts "Created localhost TLS certificates"
        end
      end

winget:
  - name: '{{ if eq .Env.CHANNEL "pro" }}OpenRun Pro{{ else }}OpenRun{{ end }}'
    publisher: OpenRunDev
    # Not templated by goreleaser, deploy/release_channel.sh goreleaser-config
    # sets OpenRunDev.OpenRunPro on this line for a Pro release
    package_identifier: OpenRunDev.OpenRun # channel-winget-id
    publisher_url: https://openrun.dev
    publisher_support_url: https://github.com/openrundev/openrun/issues
    short_description: Declarative web app deployment platform
    description: '{{ if eq .Env.CHANNEL "pro" }}Pro release of OpenRun, internal tools deployment platform.{{ else }}Internal tools deployment platform.{{ end }}'
    homepage: https://openrun.dev
    license: "{{ .Env.LICENSE_ID }}"
    # The Pro license is the LICENSE file of the released commit
    license_url: 'https://github.com/openrundev/openrun/blob/{{ if eq .Env.CHANNEL "pro" }}{{ .Tag }}{{ else }}main{{ end }}/LICENSE'
    release_notes_url: "https://github.com/openrundev/openrun/releases/tag/{{.Tag}}"
    copyright: ClaceIO LLC.
    ids: [zip-archives]
    tags:
      - cloud
      - deployment
      - webapps
      - paas
    skip_upload: auto
    # Manifests are pushed to the openrundev fork of microsoft/winget-pkgs,
    # then a PR is opened against the upstream repo. WINGET_GITHUB_TOKEN must
    # be a PAT with push access to the fork.
    repository:
      owner: openrundev
      name: winget-pkgs
      branch: "{{ .Env.PKG }}-{{.Version}}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

# New images builder
dockers_v2:
  - id: openrun_img
    ids: [openrun]
    dockerfile: deploy/Dockerfile
    # Build both platforms and publish a single multi-arch manifest
    platforms: [linux/amd64, linux/arm64]
    images:
      - "ghcr.io/openrundev/{{ .Env.PKG }}"
    tags:
      - "{{ .Version }}" # e.g. 1.2.3
      - "sha-{{ .ShortCommit }}"
      # latest is only moved by Tip releases, an empty tag is skipped
      - '{{ if eq .Env.CHANNEL "tip" }}latest{{ end }}'
    labels:
      "org.opencontainers.image.title": "{{ .Env.PKG }}"
      "org.opencontainers.image.description": "OpenRun: Declarative Web App Deployment"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"
