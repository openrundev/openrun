baseURL = "https://openrun.dev/"
languageCode = "en-us"
title = "OpenRun - Self-Hosted GitOps Platform for Docker and Kubernetes"
canonifyURLs = false
relativeURLs = false
pluralizeListTitles = false
plainIdAnchors = true
defaultContentLanguage = "en"
enableInlineShortcodes = true

[outputs]
home = ["html", "llms"]
page = ["html", "markdown"]
section = ["html", "markdown", "rss"]

[[module.imports]]
path = 'github.com/imfing/hextra'

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
endLevel = 3
ordered = false
startLevel = 2

[markup.highlight]
noClasses = false

# Default Page Parameters
[params]
title = "OpenRun - Self-Hosted GitOps Platform for Docker and Kubernetes"
# Short suffix used in <title> of inner pages instead of the full site title
titleSuffix = "OpenRun"
description = "Open-source, self-hosted GitOps platform for deploying web apps and internal tools to Docker or Kubernetes. A self-hosted PaaS alternative with SSO, RBAC and scale-to-zero."

[params.navbar]
displayTitle = false

[params.navbar.logo]
path = "openrun_anim.svg"
width = 180
height = 50

[params.footer]
displayCopyright = true
displayPoweredBy = false

[params.theme]
default = "system"
displayToggle = true

[params.banner]
key = "announcement-litestream"
message = "📌 Enable SQLite data replication to S3 with [Litestream sync](https://openrun.dev/blog/litestream)"

[params.page.contextMenu]
enable = true

[params.editURL]
enable = true
base = "https://github.com/openrundev/openrun/edit/main/docs/content"

