{{- with .Keywords }}
  <meta name="keywords" content="{{ delimit . ", " }}" />
{{- end }}
{{- if .IsHome }}
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://openrun.dev/#organization",
          "name": "OpenRun",
          "url": "https://openrun.dev/",
          "logo": "https://openrun.dev/openrun_small.png",
          "sameAs": [
            "https://github.com/openrundev",
            "https://github.com/openrundev/openrun",
            "https://twitter.com/ajay_kidave",
            "https://discord.gg/t2P8pJFsd7"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://openrun.dev/#website",
          "url": "https://openrun.dev/",
          "name": "OpenRun",
          "alternateName": "OpenRun GitOps Platform",
          "publisher": { "@id": "https://openrun.dev/#organization" }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://openrun.dev/#software",
          "name": "OpenRun",
          "url": {{ .Site.BaseURL }},
          "description": {{ partial "utils/page-description.html" . }},
          "keywords": {{ delimit (.Keywords | default slice) ", " }},
          "applicationCategory": "DeveloperApplication",
          "applicationSubCategory": "Deployment platform",
          "operatingSystem": "Linux, macOS, Windows",
          "license": "https://www.apache.org/licenses/LICENSE-2.0",
          "isAccessibleForFree": true,
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "downloadUrl": "https://github.com/openrundev/openrun/releases",
          "softwareHelp": "https://openrun.dev/docs/",
          "releaseNotes": "https://github.com/openrundev/openrun/blob/main/CHANGELOG.md",
          "publisher": { "@id": "https://openrun.dev/#organization" },
          "sameAs": ["https://github.com/openrundev/openrun"]
        }
      ]
    }
  </script>
{{- end }}

<script
  defer
  data-domain="openrun.dev"
  data-api="https://pl.demo.clace.io/api/event"
  src="https://openrun.dev/plscript.js"></script>

<!-- Google tag (gtag.js) -->
<script
  async
  src="https://www.googletagmanager.com/gtag/js?id=G-5ZC8RMDJ7C"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }
  gtag("js", new Date());

  gtag("config", "G-5ZC8RMDJ7C");
</script>

{{- $zoom := resources.Get "vendor/medium-zoom/medium-zoom.min.js" | fingerprint -}}
<script
  defer
  src="{{ $zoom.RelPermalink }}"
  integrity="{{ $zoom.Data.Integrity }}"
  crossorigin="anonymous"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    mediumZoom(".content img", { margin: 24, background: "rgba(0,0,0,0.85)" });
  });
</script>
