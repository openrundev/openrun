config:
  env:
    CL_CONFIG_FILE: openrun.toml
    CL_GITHUB_SECRET: ${CL_GITHUB_SECRET}
    GOCOVERDIR: ${GOCOVERDIR}/../client
    MAIN_HTTP_PORT: ${MAIN_HTTP_PORT}
    MAIN_HTTPS_PORT: ${MAIN_HTTPS_PORT}
tests:
  oauth0010: # copy sample app
    command: cp -r ../examples/disk_usage .

  oauth0020: ## create app with oauth auth
    command: ../openrun app create --auth=github_test --approve ./disk_usage /oauth1

  oauth0030: # check curl redirect to oauth provider (a navigation: Accept text/html)
    command: >-
      curl -sS -H "Accept: text/html" localhost:${MAIN_HTTP_PORT}/oauth1
      | grep -qF "https://localhost:${MAIN_HTTPS_PORT}/_openrun/auth/github_test/login?state=" && echo MATCHED
    stdout: MATCHED

  oauth0030a: # a request which is not a navigation gets 401, no login start, no cookie (runs before oauth0031 removes the auth)
    command: >-
      curl -sS -o /dev/null -D - localhost:${MAIN_HTTP_PORT}/oauth1 > headers.txt
      && grep -q "^HTTP/1.1 401" headers.txt
      && ! grep -qiE "^(set-cookie|location):" headers.txt
      && echo MATCHED; rm -f headers.txt
    stdout: MATCHED

  oauth0031: # update app to no auth
    command: ../openrun app update auth --promote none /oauth1

  oauth0032: # check curl
    command: curl localhost:${MAIN_HTTP_PORT}/oauth1
    stdout: "Disk Usage"

  oauth0040: ## create app with invalid auth
    command: ../openrun app create --auth=github --approve ./disk_usage /oauth2
    stderr: "error: invalid authentication type github"
    exit-code: 1

  oauth0050: ## create app with invalid auth
    command: ../openrun app create --auth=abc --approve ./disk_usage /oauth2
    stderr: "error: invalid authentication type abc"
    exit-code: 1

  oauth0060: ## create app with invalid auth
    command: ../openrun app create --auth=github_abc --approve ./disk_usage /oauth2
    stderr: "error: invalid authentication type github_abc"
    exit-code: 1

  oauth0070: # update app to invalid
    command: ../openrun app update auth --promote abc /oauth1
    stderr: "error: invalid authentication type abc"
    exit-code: 1

  oauth9999: # cleanup
    command: rm -rf ./disk_usage || true
