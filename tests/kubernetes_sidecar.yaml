config:
  env:
    CL_CONFIG_FILE: openrun.toml
    OPENRUN_HOME: .
    PATH: ${PATH}
    HOME: ${HOME}
    HTTP_PORT: ${HTTP_PORT}
    GOCOVERDIR: ${GOCOVERDIR}/../client
    KUBE_TEST_NAMESPACE: ${KUBE_TEST_NAMESPACE}
tests:
  # Sidecar containers on kubernetes: native sidecars (init containers with
  # restartPolicy Always) in the app pod, started in order before the app
  # container. The app fails at import time if the cache is not reachable on
  # localhost, so a healthy app proves the startup ordering.
  ksidecar0010: # setup app source
    command: rm -rf ./ksc_app ./ksc_star && cp -r sidecar_app ksc_app
  ksidecar0020: # create prod app with cli sidecars
    command: ../openrun app create --stage-at path --spec python-flask --approve --param app_name=ksc-cli --copt cpus=0.05 --copt memory=0.5g --sidecar '{"name":"cache","image":"image:memcached:1.6-alpine","port":11211,"args":["-m","32"],"options":{"kubernetes.memory":"64m"}}' --sidecar '{"name":"worker","command":["python","worker.py"],"env":{"WORKER_ROLE":"cli"}}' ./ksc_app /ksc_cli
  ksidecar0021: # stage app is up
    command: curl -sS localhost:${HTTP_PORT}/ksc_cli_cl_stage
    stdout: hello
    config:
      retries: 15
      interval: 2s
  ksidecar0022: # app reaches the cache on localhost inside the pod
    command: curl -sS localhost:${HTTP_PORT}/ksc_cli_cl_stage/env
    stdout: "cache_addr=localhost:11211"
  ksidecar0023: # cache sidecar works
    command: curl -sS localhost:${HTTP_PORT}/ksc_cli_cl_stage/cache
    stdout: "cache ok: v1"
  ksidecar0024: # worker sidecar runs the app image with its command, inherits params but not PORT
    command: curl -sS localhost:${HTTP_PORT}/ksc_cli_cl_stage/worker
    stdout: "alive role=cli app_name=ksc-cli port=-"
    config:
      retries: 10
      interval: 1s
  # The app path is a pod annotation (not label safe), so pods are matched
  # through a go-template over the annotation
  ksidecar0025: # sidecars are native sidecars in the app pod, in order, before the app container
    command: kubectl get pods -n ${KUBE_TEST_NAMESPACE}-apps -o go-template='{{range .items}}{{if eq (index .metadata.annotations "dev.openrun.app.path") "/ksc_cli_cl_stage"}}{{range .spec.initContainers}}{{.name}}={{.restartPolicy}},{{end}}{{"\n"}}{{end}}{{end}}'
    stdout: "cache=Always,worker=Always,"
  ksidecar0026: # the app pod does not mount the service account token
    command: kubectl get pods -n ${KUBE_TEST_NAMESPACE}-apps -o go-template='{{range .items}}{{if eq (index .metadata.annotations "dev.openrun.app.path") "/ksc_cli_cl_stage"}}automount={{.spec.automountServiceAccountToken}}{{"\n"}}{{end}}{{end}}'
    stdout: "automount=false"
  ksidecar0027: # sidecar resources from options
    command: kubectl get pods -n ${KUBE_TEST_NAMESPACE}-apps -o go-template='{{range .items}}{{if eq (index .metadata.annotations "dev.openrun.app.path") "/ksc_cli_cl_stage"}}{{range .spec.initContainers}}{{if eq .name "cache"}}memory={{index .resources.limits "memory"}}{{end}}{{end}}{{"\n"}}{{end}}{{end}}'
    stdout: "memory=67108864"
  ksidecar0030: # promote
    command: ../openrun app promote /ksc_cli
  ksidecar0031: # prod works
    command: curl -sS localhost:${HTTP_PORT}/ksc_cli/cache
    stdout: "cache ok: v1"
    config:
      retries: 15
      interval: 2s
  ksidecar0032: # prod worker
    command: curl -sS localhost:${HTTP_PORT}/ksc_cli/worker
    stdout: "alive role=cli"
    config:
      retries: 10
      interval: 1s

  ksidecar0040: # update sidecars through metadata
    command: ../openrun app update sidecars '{"name":"cache","image":"image:memcached:1.6-alpine","port":11211,"args":["-m","32"]}' '{"name":"worker","command":["python","worker.py"],"env":{"WORKER_ROLE":"updated"}}' /ksc_cli
    stdout: "1 app(s) updated"
  ksidecar0041: # stage rolled to the new version
    command: curl -sS localhost:${HTTP_PORT}/ksc_cli_cl_stage/worker
    stdout: "alive role=updated"
    config:
      retries: 15
      interval: 2s

  # --- app.star declared sidecars ---
  ksidecar0060: # setup app.star variant
    command: cp -r sidecar_app ksc_star && cp sidecar_app/app.star.txt ksc_star/app.star
  ksidecar0061: # create, permissions approved
    command: ../openrun app create --approve --stage-at path --copt cpus=0.05 --copt memory=0.5g ./ksc_star /ksc_star
    stdout:
      contains:
        - "container.in.sidecar [cache image:memcached:1.6-alpine]"
        - "container.in.sidecar [worker]"
  ksidecar0062: # stage works
    command: curl -sS localhost:${HTTP_PORT}/ksc_star_cl_stage/cache
    stdout: "cache ok: v1"
    config:
      retries: 15
      interval: 2s
  ksidecar0063: # worker env from container.sidecar
    command: curl -sS localhost:${HTTP_PORT}/ksc_star_cl_stage/worker
    stdout: "alive role=star"
    config:
      retries: 10
      interval: 1s

  ksidecar0080: # record the sanitized stage app id for the delete cleanup check
    command: bash -c '../openrun app list --internal --format csv /ksc_star | grep -o "app_stg_[a-z0-9]*" | head -1 | tr "_" "-" > ksc_id.txt && [ -s ksc_id.txt ]'

  ksidecar0090: # cleanup
    command: ../openrun app delete "/ksc_*" && rm -rf ./ksc_app ./ksc_star
  ksidecar0091: # delete removed the app's workloads, service and generated objects
    command: bash -c 'id=$(cat ksc_id.txt); rm -f ksc_id.txt; n=$(kubectl get deploy,hpa,svc,secret,configmap,pvc -n ${KUBE_TEST_NAMESPACE}-apps -o name | grep -c "$id"); echo "objects=$n"'
    stdout: "objects=0"
    config:
      retries: 10
      interval: 2s
